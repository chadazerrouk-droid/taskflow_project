<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestion du Projet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .timeline { border-left: 3px solid #0d6efd; padding-left: 20px; list-style: none; }
        .timeline-item { margin-bottom: 15px; position: relative; }
        .timeline-item::before { 
            content: ""; position: absolute; left: -26px; top: 5px;
            width: 10px; height: 10px; background: #0d6efd; border-radius: 50%;
        }
        .card { border: none; border-radius: 12px; }
        .bg-primary { background-color: #0d6efd !important; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 id="projectTitle" class="mb-4 text-primary font-weight-bold">Chargement du projet...</h2>

    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Inviter un membre</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small">Saisissez l'email d'un utilisateur inscrit pour l'ajouter.</p>
                    <div class="input-group">
                        <input type="email" id="inviteEmail" class="form-control" placeholder="exemple@mail.com">
                        <button class="btn btn-primary" onclick="inviteUser()">Ajouter</button>
                    </div>
                    <div id="inviteFeedback" class="mt-3"></div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">📜 Historique d'activité</h5>
                </div>
                <div class="card-body">
                    <ul id="activityTimeline" class="timeline">
                        <p class="text-muted">Recherche des activités...</p>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialisation des variables
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    const token = localStorage.getItem('token');

    // 1. CHARGER LES DÉTAILS DU PROJET (NOM)
    async function loadProjectDetails() {
        try {
            const res = await fetch(`/api/projects/${projectId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const project = await res.json();
            
            if (res.ok) {
                document.getElementById('projectTitle').innerText = project.name;
            } else {
                document.getElementById('projectTitle').innerText = "Projet introuvable";
            }
        } catch (err) {
            console.error("Erreur détails:", err);
            document.getElementById('projectTitle').innerText = "Erreur de connexion";
        }
    }

    // 2. INVITER UN MEMBRE
    async function inviteUser() {
        const email = document.getElementById('inviteEmail').value;
        const feedback = document.getElementById('inviteFeedback');

        if(!email) return alert("Entrez un email !");

        try {
            const res = await fetch(`/api/projects/${projectId}/invite`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            if (res.ok) {
                feedback.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
                loadActivities(); // Rafraîchir l'historique
            } else {
                feedback.innerHTML = `<div class="alert alert-danger">❌ ${data.message}</div>`;
            }
        } catch (err) {
            console.error(err);
        }
    }

    // 3. CHARGER L'HISTORIQUE
    async function loadActivities() {
        try {
            const res = await fetch(`/api/projects/${projectId}/activities`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const activities = await res.json();
            const list = document.getElementById('activityTimeline');

            if (res.ok && activities.length > 0) {
                list.innerHTML = activities.map(act => `
                    <li class="timeline-item">
                        <small class="text-muted">${new Date(act.timestamp).toLocaleString()}</small><br>
                        <strong>${act.user ? act.user.name : 'Utilisateur'}</strong> ${act.description}
                    </li>
                `).join('');
            } else {
                list.innerHTML = '<p class="text-muted">Aucune activité enregistrée pour le moment.</p>';
            }
        } catch (err) {
            console.error("Erreur historique:", err);
            document.getElementById('activityTimeline').innerHTML = '<p class="text-danger">Erreur de chargement.</p>';
        }
    }

    // LANCEMENT AUTOMATIQUE
    if (projectId && token) {
        loadProjectDetails();
        loadActivities();
    } else {
        alert("Attention : Token ou ID Projet manquant ! Connectez-vous d'abord.");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
