<!doctype html>
<html>
  <head>
    <title>Test Token Storage</title>
  </head>
  <body>
    <h2>Test Token + Axios</h2>
    <button onclick="simulerLogin()">1. Simuler Login</button>
    <button onclick="voirToken()">2. Voir token stocké</button>
    <button onclick="supprimerToken()">3. Supprimer token</button>
    <pre id="result"></pre>

    <script>
      function simulerLogin() {
        
        const fakeToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.fake";
        localStorage.setItem("token", fakeToken);
        document.getElementById("result").innerText =
          "✅ Token stocké dans LocalStorage: " + fakeToken;
      }

      function voirToken() {
        const token = localStorage.getItem("token");
        if (token) {
          document.getElementById("result").innerText =
            "📦 Token trouvé: " + token;
        } else {
          document.getElementById("result").innerText = "❌ Aucun token trouvé";
        }
      }

      function supprimerToken() {
        localStorage.removeItem("token");
        document.getElementById("result").innerText = "🗑️ Token supprimé";
      }
    </script>
  </body>
</html>
