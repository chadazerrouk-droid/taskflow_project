<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 320px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .error { color: red; text-align: center; margin-top: 10px; }
        a { text-decoration: none; color: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Connexion</h2>
        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" />
        <button id="loginBtn">Se connecter</button>
        <p id="error" class="error"></p>
        <p style="text-align: center;">Pas de compte ? <a href="register.html">S'inscrire</a></p>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async function(e) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            if (!email || !password) {
                errorDiv.innerText = 'Veuillez remplir tous les champs';
                return;
            }

            try {
                const response = await axios.post('/api/login', { email, password });
                const token = response.data.token;
                localStorage.setItem('token', token);
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorDiv.innerText = err.response?.data?.message || 'Erreur de connexion';
            }
        });
    </script>
</body>
</html>
