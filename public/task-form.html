<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Formulaire tâche</title>
  <style>
    body { font-family: Arial; margin: 2rem; }
    input, textarea, select { display: block; margin: 0.5rem 0; padding: 0.5rem; width: 300px; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Créer / Modifier une tâche</h1>
  <form id="taskForm">
    <input type="text" id="title" placeholder="Titre" required>
    <textarea id="description" placeholder="Description"></textarea>
    <select id="priority">
      <option value="basse">Basse</option>
      <option value="moyenne">Moyenne</option>
      <option value="haute">Haute</option>
    </select>
    <select id="status">
      <option value="à faire">À faire</option>
      <option value="en cours">En cours</option>
      <option value="terminé">Terminé</option>
    </select>
    <button type="submit">Enregistrer</button>
    <button type="button" id="restoreBtn">Restaurer brouillon</button>
    <button type="button" id="clearBtn">Effacer brouillon</button>
  </form>
  <div id="message"></div>

  <script src="task-form.js"></script>
</body>
</html>
