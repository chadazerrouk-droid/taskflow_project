<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 400px; border-radius: 15px;">
            <h3 class="text-center mb-4 text-primary">Connexion Alice</h3>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" value="alice@test.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" id="pass" class="form-control" value="password123">
            </div>
            <button onclick="login()" class="btn btn-primary w-100">Se connecter</button>
            <div id="msg" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const msg = document.getElementById('msg');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // 1. On stocke le token (indispensable pour ne pas avoir d'erreur 401)
                    localStorage.setItem('token', data.token);
                    msg.innerHTML = "<span class='text-success'>✅ Connexion réussie !</span>";

                    // 2. REDIRECTION VERS LE BON ID : 6a00809fbf8838c83a2aeba7
                    setTimeout(() => {
                        window.location.href = "project-details.html?id=6a00809fbf8838c83a2aeba7";
                    }, 800);
                } else {
                    msg.innerHTML = "<span class='text-danger'>❌ " + (data.message || "Erreur") + "</span>";
                }
            } catch (err) {
                msg.innerHTML = "<span class='text-danger'>Erreur serveur</span>";
            }
        }
    </script>
</body>
</html>
