<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>TaskFlow - Liste des tâches</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f4f4;
      }
      .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
      }
      .task-card {
        border: 1px solid #ddd;
        margin: 10px 0;
        padding: 15px;
        border-radius: 8px;
        background: #fafafa;
      }
      .filters {
        background: #e9ecef;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: end;
      }
      .filters input,
      .filters select,
      .filters button {
        padding: 8px;
      }
      .pagination {
        margin-top: 20px;
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .pagination button {
        padding: 6px 12px;
        cursor: pointer;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.danger {
        background: #dc3545;
      }
      button.success {
        background: #28a745;
      }
      a {
        text-decoration: none;
        display: inline-block;
        margin-top: 15px;
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📋 Gestion des tâches</h1>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Rechercher (titre)" />
        <select id="statusSelect">
          <option value="">Tous statuts</option>
          <option value="à faire">À faire</option>
          <option value="en cours">En cours</option>
          <option value="terminé">Terminé</option>
        </select>
        <select id="prioritySelect">
          <option value="">Toutes priorités</option>
          <option value="basse">Basse</option>
          <option value="moyenne">Moyenne</option>
          <option value="haute">Haute</option>
        </select>
        <button id="applyFiltersBtn">🔍 Appliquer</button>
        <a href="task-form.html">➕ Nouvelle tâche</a>
      </div>

      <div id="tasksList">Chargement...</div>
      <div id="paginationControls" class="pagination"></div>
    </div>

    <script src="task-form.js"></script>
  </body>
</html>
