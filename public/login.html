<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Connexion à TaskFlow</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" value="e1@taskflow.com" required>
            <input type="password" id="password" placeholder="Mot de passe" value="123456" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                console.log("data reçue :", data);
                console.log("message d'erreur :", data.message);
                console.log("erreur complète :", data.error);

                if (!res.ok) {
                    // ← LIGNE 35 modifiée
                    messageDiv.innerHTML = '<div class="message error">❌ Erreur : ' + (data.message || 'Identifiants invalides') + '</div>';
                    return;
                }

                localStorage.setItem('token', data.token);
                // ← LIGNE 41 modifiée
                messageDiv.innerHTML = '<div class="message success">✅ Connexion réussie ! Redirection...</div>';
                setTimeout(() => {
                    window.location.href = '/task-form.html';
                }, 1500);
            } catch (err) {
                // ← LIGNE 47 modifiée
                messageDiv.innerHTML = '<div class="message error">❌ Erreur réseau : ' + err.message + '</div>';
            }
        });
    </script>
</body>
</html>
