version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: taskflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: taskflow-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - PORT=5000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data: