<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>TaskFlow - Nouvelle tâche</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Créer une tâche</h1>

      <div id="restoreBox" class="restore-box" style="display:none">
        <p>💾 Un brouillon sauvegardé a été trouvé.</p>
        <button id="restoreBtn" class="btn-warning">Restaurer</button>
        <button id="discardBtn" class="btn-warning">Ignorer</button>
      </div>

      <form id="taskForm">
        <label>Titre *</label>
        <input type="text" id="title" placeholder="Ex: Faire le rapport" required />

        <label>Description</label>
        <textarea id="description" rows="3" placeholder="Détails de la tâche..."></textarea>

        <label>Priorité</label>
        <select id="priority">
          <option value="basse">Basse</option>
          <option value="moyenne" selected>Moyenne</option>
          <option value="haute">Haute</option>
        </select>

        <label>Statut</label>
        <select id="status">
          <option value="à faire">À faire</option>
          <option value="en cours">En cours</option>
          <option value="terminé">Terminé</option>
        </select>

        <label>ID du projet *</label>
        <input type="text" id="projectId" placeholder="69f88efb92178d2d46906e4a" required />

        <button type="submit">Créer la tâche</button>
      </form>

      <hr />
      <div id="message"></div>
      <p style="font-size: 12px; color: #666; text-align: center">
        💾 Sauvegarde automatique du brouillon dans votre navigateur
      </p>
    </div>

    <script src="task-form.js"></script>
  </body>
</html>
